[package]
name = "pair"
version = "0.4.1"
edition = "2024"
rust-version = "1.88"
description = "A small, encrypted LAN notepad for two computers"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:fltk"]

[dependencies]
fltk = { version = "=1.5.23", optional = true, default-features = false, features = ["no-images", "use-ninja"] }
flume = { version = "0.11", default-features = false }
mdns-sd = { version = "0.17", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[[bin]]
name = "pair"
path = "src/main.rs"
required-features = ["gui"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
